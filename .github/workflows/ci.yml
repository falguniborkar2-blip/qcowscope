name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU tools and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils python3-pytest
          qemu-img --version | head -1
      - name: Build (-Wall -Wextra -Werror)
        run: make CC=${{ matrix.cc }}
      - name: Tests, compared against real qemu-img
        run: make CC=${{ matrix.cc }} test
      - name: Tests under AddressSanitizer + UBSan
        run: make CC=${{ matrix.cc }} asan
